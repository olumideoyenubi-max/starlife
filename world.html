    rect: (u0, u1, v0, v1) => { const a = [cx + f[0] * (inner - v0) + r[0] * u0, cz + f[1] * (inner - v0) + r[1] * u0], b = [cx + f[0] * (inner - v1) + r[0] * u1, cz + f[1] * (inner - v1) + r[1] * u1]; return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])]; },

// sidewalk slab with a granite kerb; heights wobble slightly so it never looks machine-flat
function sidewalk(cx, cz) {

  batch(M.paving).flat(x0 + 0.3, z0 + 0.3, x1 - 0.3, z1 - 0.3, h, 4);
  // kerb stones in 1.5 m pieces
  for (const side of ['n', 's', 'e', 'w']) {
    const len = HALF * 2, pieces = Math.round(len / 1.5);

      const a = -HALF + i * 1.5, b = a + 1.5, j = (rnd() - 0.5) * 0.012, hh = h + (rnd() - 0.5) * 0.01;

  }

}

    const fl = ring === 1 ? 3 + Math.floor(rnd() * 4) : 4 + Math.floor(rnd() * (cx > 0 && cz < 0 ? 10 : 6));

// =====================================================================
// Street furniture, instanced (one draw call per kind)
// =====================================================================
const lampHeads = [];
function instanced(geo, mat, list, place, { shadow = true } = {}) {
  const im = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  list.forEach((it, i) => { place(it, p, q, s); m.compose(p, q, s); im.setMatrixAt(i, m); });
  im.count = list.length; im.castShadow = shadow && T.shadow > 0; im.receiveShadow = T.shadow > 0;
  im.computeBoundingSphere(); scene.add(im); return im;
}
const yQ = (q, ry) => q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry);
function noisyBlob(r, detail, amp, sx = 1, sy = 1, sz = 1) {
  const g = new THREE.IcosahedronGeometry(r, detail), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = 1 + (Math.sin(v.x * 9.1 + v.y * 4.3) * Math.cos(v.z * 7.7 - v.y * 3.1)) * amp + (rnd() - 0.5) * amp * 0.6; p.setXYZ(i, v.x * n * sx, v.y * n * sy, v.z * n * sz); }
  g.computeVertexNormals(); return g;
}
function colorize(g, hex, jitter = 0) {
  const c = new THREE.Color(hex), n = g.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const k = 1 + (rnd() - 0.5) * jitter; arr[i * 3] = c.r * k; arr[i * 3 + 1] = c.g * k; arr[i * 3 + 2] = c.b * k; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3)); return g;
}
function buildProps() {
  const keepOff = (x, z) => places.some(p => Math.hypot(p.x - x, p.z - z) < 2.6) || seats.some(s => Math.hypot(s.x - x, s.z - z) < 1.5);
  const lamps = lampSpots.filter(([x, z]) => !keepOff(x, z));
  const lampGeo = mergeGeometries([
    new THREE.CylinderGeometry(0.06, 0.1, 5.6, 10).translate(0, 2.8, 0),
    new THREE.CylinderGeometry(0.13, 0.15, 0.5, 10).translate(0, 0.25, 0),
    new THREE.BoxGeometry(0.06, 0.06, 1.3).translate(0, 5.55, 0.6),
    new THREE.BoxGeometry(0.34, 0.12, 0.6).translate(0, 5.5, 1.2),
  ]);
  instanced(lampGeo, M.metal, lamps, ([x, z, ry], p, q) => { p.set(x, heightAt(x, z), z); yQ(q, ry); });
  instanced(new THREE.BoxGeometry(0.28, 0.04, 0.5).translate(0, 5.43, 1.2), M.glow, lamps, ([x, z, ry], p, q) => { p.set(x, heightAt(x, z), z); yQ(q, ry); }, { shadow: false });
  for (const [x, z, ry] of lamps) { lampHeads.push(new THREE.Vector3(x + Math.sin(ry) * 1.2, heightAt(x, z) + 5.3, z + Math.cos(ry) * 1.2)); solid(x - 0.15, z - 0.15, x + 0.15, z + 0.15, 1); }

  // trees: three canopy variants with vertex-colour variation
  const trees = treeSpots.filter(([x, z]) => !keepOff(x, z));
  const variants = [0, 1, 2].map(v => {
    const parts = [];
    const n = 5 + v;
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 + rnd(), r = i === 0 ? 0 : 0.9 + rnd() * 0.5; parts.push(colorize(noisyBlob(1.1 + rnd() * 0.5, 1, 0.18, 1, 0.85, 1).translate(Math.cos(a) * r, 4.6 + rnd() * 1.2 + (i === 0 ? 0.8 : 0), Math.sin(a) * r), pick(['#3f6b35', '#4f7a3a', '#5d8a42', '#355e2f']), 0.25)); }
    return mergeGeometries(parts);
  });
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.2, 4.6, 8).translate(0, 2.3, 0);
  instanced(trunkGeo, M.trunk, trees, ([x, z, s], p, q, sc) => { p.set(x, heightAt(x, z), z); yQ(q, rnd() * 6); sc.setScalar(s); });
  const leafMat = std({ vertexColors: true, roughness: 0.9 });
  variants.forEach((g, v) => { const sub = trees.filter((_, i) => i % 3 === v); instanced(g, leafMat, sub, ([x, z, s], p, q, sc) => { p.set(x, heightAt(x, z), z); yQ(q, rnd() * 6); sc.setScalar(s); }); });
  for (const [x, z, s] of trees) if (Math.abs(x) < EDGE && Math.abs(z) < EDGE) solid(x - 0.25 * s, z - 0.25 * s, x + 0.25 * s, z + 0.25 * s, 1);
  const pits = trees.filter(([x, z]) => Math.abs(x) < EDGE && Math.abs(z) < EDGE && heightAt(x, z) > 0.1);
  instanced(new THREE.BoxGeometry(1.2, 0.02, 1.2), std({ color: 0x3a2e24, roughness: 1 }), pits, ([x, z], p) => p.set(x, heightAt(x, z) + 0.005, z), { shadow: false });

  // benches (you can sit on these)
  const benchGeo = mergeGeometries([
    ...[0, 1, 2].map(i => new THREE.BoxGeometry(1.7, 0.04, 0.11).translate(0, 0.45, -0.1 + i * 0.13)),
    ...[0, 1].map(i => new THREE.BoxGeometry(1.7, 0.1, 0.035).translate(0, 0.62 + i * 0.13, -0.22).rotateX(0)),
  ]);
  const legGeo = mergeGeometries([-0.75, 0.75].map(x => new THREE.BoxGeometry(0.06, 0.45, 0.42).translate(x, 0.225, 0)));
  const benches = benchSpots.filter(([x, z]) => !keepOff(x, z));

  instanced(legGeo, M.metal, benches, ([x, z, ry], p, q) => { p.set(x, heightAt(x, z), z); yQ(q, ry); });
  for (const [x, z, ry, pl] of benches) for (const s of [-0.45, 0.45]) seats.push({ x: x + Math.cos(ry) * s, z: z - Math.sin(ry) * s, ry, y: heightAt(x, z) + 0.47, place: pl || 'park', label: 'Sit on the bench' });

  // bins and hydrants
  const bins = [], hyd = [];
  for (let n = 0; n < 60; n++) { const [x, z, ry] = pick(lampSpots); const off = 3 + rnd() * 2, xx = x + Math.cos(ry) * off, zz = z - Math.sin(ry) * off; if (!keepOff(xx, zz)) (rnd() < 0.6 ? bins : hyd).push([xx, zz, ry]); }
  instanced(new THREE.CylinderGeometry(0.24, 0.21, 0.85, 14).translate(0, 0.425, 0), std({ color: 0x2e4a3a, roughness: 0.6, metalness: 0.3 }), bins, ([x, z], p) => p.set(x, heightAt(x, z), z));
  instanced(mergeGeometries([new THREE.CylinderGeometry(0.11, 0.13, 0.62, 12).translate(0, 0.31, 0), new THREE.SphereGeometry(0.12, 12, 8).translate(0, 0.62, 0), new THREE.CylinderGeometry(0.05, 0.05, 0.34, 8).rotateZ(Math.PI / 2).translate(0, 0.42, 0)]), std({ color: 0xb8322e, roughness: 0.5 }), hyd, ([x, z], p) => p.set(x, heightAt(x, z), z));
  for (const [x, z] of [...bins, ...hyd]) solid(x - 0.22, z - 0.22, x + 0.22, z + 0.22, 1);

  // parked cars along the kerbs
  const cars = [];
  for (let n = 0; n < 34; n++) {
    const vert = rnd() < 0.5, k = Math.floor(rnd() * (2 * N + 2)) - N - 1, road = k * CELL + CELL / 2, side = rnd() < 0.5 ? -1 : 1;
    const t = (Math.floor(rnd() * (2 * N + 1)) - N) * CELL + (rnd() - 0.5) * 22;
    const off = road + side * 4.6;
    const [x, z] = vert ? [off, t] : [t, off];
    if (x > AVE.x0 - 3 && x < AVE.x1 + 3 && z > AVE.z0 - 4 && z < AVE.z1 + 4) continue;
    if (Math.abs(x) > EDGE - 3 || Math.abs(z) > EDGE - 3 || cars.some(c => Math.hypot(c[0] - x, c[1] - z) < 6)) continue;
    cars.push([x, z, vert ? 0 : Math.PI / 2, pick(['#c8344a', '#f4f1ea', '#2b3a67', '#1f1b22', '#9fb6cc', '#e8c64a', '#3f7f6b', '#b9b9be', '#f2c6d2'])]);
  }
  const body = mergeGeometries([new RoundedBoxGeometry(1.8, 0.7, 4.3, 3, 0.22).translate(0, 0.62, 0), new RoundedBoxGeometry(1.62, 0.62, 2.3, 3, 0.25).translate(0, 1.18, -0.2)]);
  const glass = new RoundedBoxGeometry(1.66, 0.46, 2.18, 2, 0.2).translate(0, 1.2, -0.2);
  const wheels = mergeGeometries([[-0.82, 1.35], [0.82, 1.35], [-0.82, -1.35], [0.82, -1.35]].map(([x, z]) => new THREE.CylinderGeometry(0.33, 0.33, 0.24, 16).rotateZ(Math.PI / 2).translate(x, 0.33, z)));
  const lights = mergeGeometries([[-0.6, 2.13], [0.6, 2.13]].map(([x, z]) => new THREE.BoxGeometry(0.34, 0.12, 0.06).translate(x, 0.75, z)));

  cars.forEach((c, i) => bodyIM.setColorAt(i, new THREE.Color(c[3])));

  instanced(wheels, std({ color: 0x151515, roughness: 0.8 }), cars, ([x, z, ry], p, q) => { p.set(x, 0, z); yQ(q, ry); });
  instanced(lights, M.glow, cars, ([x, z, ry], p, q) => { p.set(x, 0, z); yQ(q, ry); }, { shadow: false });
  for (const [x, z, ry] of cars) { const w = ry ? 2.2 : 1.0, d = ry ? 1.0 : 2.2; solid(x - w, z - d, x + w, z + d, 1.5); }

  // water towers on some roofs
  const wt = mergeGeometries([new THREE.CylinderGeometry(1.2, 1.2, 2.2, 16).translate(0, 3.1, 0), new THREE.ConeGeometry(1.35, 0.9, 16).translate(0, 4.65, 0), ...[[-0.8, -0.8], [0.8, -0.8], [-0.8, 0.8], [0.8, 0.8]].map(([a, b]) => new THREE.CylinderGeometry(0.06, 0.06, 2, 6).translate(a, 1, b))]);
  instanced(wt, std({ color: 0x7a5a42, roughness: 0.9 }), waterTowers, ([x, y, z], p) => p.set(x, y, z));
}

    { label: 'Compliment their look', note: '+charisma', run: () => { befriend(pp.id, 2); addSkill('charisma', 0.15); bump('social', 3); talkMenu(pp, say('compliment')); } },
    following ? { label: 'Say goodbye', run: () => { pp.prevState = 'idle'; closeCard(); toast(`${pp.spec.name.split(' ')[0]} heads off. See you soon!`); } }

  ], pp.id);
}
function advance(mins) { life.min += mins; }

function findNear() {

// ---------- waypoint ----------

// =====================================================================
// HUD and phone
// =====================================================================
let hudSig = '';

}
const mapCv = $('#mapCv'), mg = mapCv.getContext('2d');
const MAPS = 600 / (2 * EDGE + 16), toMap = (x, z) => [300 + x * MAPS, 300 + z * MAPS];
function drawMap() {

    const key = `${i},${j}`, [x, y] = toMap(i * CELL - HALF, j * CELL - HALF), s = HALF * 2 * MAPS;
    mg.fillStyle = key in PARKS ? '#3f6b35' : LAND[key] ? '#4a4652' : '#3c3d45'; mg.beginPath(); mg.roundRect(x, y, s, s, 4); mg.fill();
  }

  { const [a, b] = toMap(MALL.cx - HALF, -HALF); mg.fillStyle = '#6a6070'; mg.beginPath(); mg.roundRect(a, b, HALF * 2 * MAPS, HALF * 2 * MAPS, 4); mg.fill(); }
  mg.font = '600 13px Inter, sans-serif'; mg.textAlign = 'center';

  }

}
function renderPhone() {

  $('#friends').innerHTML = people.filter(p => p.starlet).map((pp, i) => {
    const r = sim().rel[pp.id] || 0, near = places.reduce((a, p) => { const d = Math.hypot(p.x - pp.pos.x, p.z - pp.pos.z); return d < a[1] ? [p, d] : a; }, [null, 30])[0];
    const where = pp.state === 'inside' ? 'at home' : pp.state === 'follow' ? 'with you' : near ? `near ${near.name}` : 'out and about';
    return `<button class="place friend" data-find="${pp.id}"><i style="background:${pp.spec.hairColor};outline:2px solid ${pp.spec.skin}"></i><b>${esc(pp.spec.name)}<br><small>${esc(where)}</small></b><span class="bar"><b style="width:${r}%"></b></span><small>${relLabel(r)}</small></button>`;
  }).join('');

  $('#tierNote').textContent = { low: 'No shadows, shorter draw distance, smaller crowd. Best for phones.', medium: 'Soft shadows, sky lighting and a busier town.', high: 'Sharper shadows, anti-aliasing, longest view and the biggest crowd.' }[world.tier];

}
function togglePhone(on = $('#phone').hidden) { $('#phone').hidden = !on; $('#phoneBtn .dot')?.remove(); if (on) renderPhone(); updateHud(true); }

// =====================================================================
// Input: keyboard, mouse orbit, touch joystick and look
// =====================================================================
addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea')) return;
  if (e.code === 'KeyE' || (e.code === 'Enter' && !ui.modal && document.activeElement === canvas)) { e.preventDefault(); interact(); return; }
  if (e.code === 'Escape') { if (ui.modal) closeCard(); else if (!$('#phone').hidden) togglePhone(false); return; }
  if (e.code === 'KeyM') { togglePhone(); return; }
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  keys.add(e.code); hideHint();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (1 + Math.sign(e.deltaY) * 0.12), 2, 14); }, { passive: false });
const pointers = new Map();
canvas.addEventListener('pointerdown', e => {
  canvas.focus(); canvas.setPointerCapture(e.pointerId);
  const isTouch = e.pointerType === 'touch';
  if (isTouch && e.clientX < innerWidth * 0.45 && !joy) {
    joy = { id: e.pointerId, cx: e.clientX, cy: e.clientY, x: 0, y: 0, mag: 0 };
    const j = $('#joy'); j.hidden = false; j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.firstElementChild.style.transform = '';
  } else pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() });
  hideHint();
});
canvas.addEventListener('pointermove', e => {

    const dx = e.clientX - joy.cx, dy = e.clientY - joy.cy, d = Math.hypot(dx, dy), R = 50, k = Math.min(1, d / R);
    joy.x = d ? dx / d * k : 0; joy.y = d ? dy / d * k : 0; joy.mag = k;
    $('#joy i').style.transform = `translate(${joy.x * R}px, ${joy.y * R}px)`;
    return;
  }
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;

const endPtr = e => {

  const p = pointers.get(e.pointerId); pointers.delete(e.pointerId); cam.pinch = null;
  // a quick tap on a starlet talks to them
  if (p && Math.hypot(p.x - p.sx, p.y - p.sy) < 6 && performance.now() - p.t < 300) tapPick(e.clientX, e.clientY);
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
const rc = new THREE.Raycaster();
function tapPick(x, y) {
  if (ui.modal || busy) return;
  rc.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  let best = null, bd = 1e9;
  for (const pp of people) { if (!pp.starlet || !pp.ch.group.visible) continue; tmpV.copy(pp.pos).setY(pp.pos.y + 1.1); const d = rc.ray.distanceToPoint(tmpV), far = tmpV.distanceTo(camera.position); if (d < 0.45 && far < 30 && far < bd) { bd = far; best = pp; } }
  if (!best) return;
  if (Math.hypot(best.pos.x - player.pos.x, best.pos.z - player.pos.z) < 3.2) talkTo(best);
  else { setWaypoint({ name: best.spec.name.split(' ')[0], pp: best }); }
}
$('#prompt').addEventListener('click', interact);
$('#cardX').addEventListener('click', closeCard);
$('#cardOpts').addEventListener('click', e => { const b = e.target.closest('[data-opt]'); if (!b || b.disabled) return; const o = ui.modal.opts[+b.dataset.opt]; o.run && o.run(); });
$('#phoneBtn').addEventListener('click', () => togglePhone());
$('#compassX').addEventListener('click', () => setWaypoint(null));
$$('#phone .tabs button').forEach(b => b.addEventListener('click', () => { $$('#phone .tabs button').forEach(x => x.classList.toggle('on', x === b)); $$('#phone .pane').forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab); renderPhone(); }));
$('#places').addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (!b) return; const p = places[+b.dataset.goto]; setWaypoint(p); togglePhone(false); });
$('#friends').addEventListener('click', e => { const b = e.target.closest('[data-find]'); if (!b) return; const pp = people.find(x => x.id === b.dataset.find); if (pp.state === 'inside') { toast(`${pp.spec.name.split(' ')[0]} is at home asleep.`); return; } setWaypoint({ name: pp.spec.name.split(' ')[0], pp }); togglePhone(false); });
mapCv.addEventListener('click', e => {
  const r = mapCv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 600, y = (e.clientY - r.top) / r.height * 600;
  let best = null, bd = 30; for (const p of places) { const [px, py] = toMap(p.x, p.z), d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; best = p; } }
  if (best) { setWaypoint(best); togglePhone(false); }
});
$('#tierSeg').addEventListener('click', e => { const b = e.target.closest('[data-tier]'); if (!b || b.dataset.tier === world.tier) return; world.tier = b.dataset.tier; saveAll(); location.reload(); });
$('#speedSeg').addEventListener('click', e => { const b = e.target.closest('[data-speed]'); if (!b) return; world.speed = +b.dataset.speed; renderPhone(); saveAll(); });
$('#fpsSeg').addEventListener('click', e => { const b = e.target.closest('[data-fps]'); if (!b) return; world.fps = +b.dataset.fps; $('#fps').hidden = !world.fps; renderPhone(); saveAll(); });
let hintHidden = false;
function hideHint() { if (hintHidden) return; hintHidden = true; setTimeout(() => { $('#hint').style.opacity = 0; setTimeout(() => $('#hint').hidden = true, 900); }, 6000); }
if (touch) $('#hint').textContent = 'Drag on the left to walk · drag on the right to look · tap a starlet to talk';
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
addEventListener('pagehide', saveAll);

// =====================================================================
// Main loop
// =====================================================================
const lampLights = [...Array(T.lamps)].map(() => { const l = new THREE.PointLight(0xffd9a0, 0, 18, 1.6); l.castShadow = false; scene.add(l); return l; });
let lampT = 0, saveT = 0, phoneT = 0, fpsN = 0, fpsT = 0, sprayT = 0, lastDecay = 0;
const clock = new THREE.Clock();
function tick() {
  const raw = Math.min(1, clock.getDelta()), dt = Math.min(0.05, raw);

  if (gm) {

    for (const [k] of NEEDS) n[k] = clamp(n[k] - DECAY[k] * gm, 0, 100);
    if (player.seat) { n.energy = clamp(n.energy + 0.12 * gm, 0, 100); n.fun = clamp(n.fun + 0.12 * gm, 0, 100); if (people.some(pp => pp.starlet && pp.seat && Math.hypot(pp.pos.x - player.pos.x, pp.pos.z - player.pos.z) < 3)) n.social = clamp(n.social + 0.25 * gm, 0, 100); }
  }

    stepPerson(pp, dt, busy ? dt * 30 : gm);
    const d = pp.pos.distanceTo(player.pos);

    pp.ch.group.visible = vis;
    if (vis) {
      animate(pp.ch, dt, pp.state === 'sit' ? 0 : pp.speed);
      if (pp.ch.meshes.detail) pp.ch.meshes.detail.visible = d < T.detail;

      if (pp.tag) { pp.tag.visible = d < 14 && d > 2.6 && !busy; pp.tag.material.opacity = clamp((14 - d) / 4, 0, 1); }
    }
  }
  updateCamera(dt);
  updateSky();
  sky.position.copy(camera.position);
  // street lamps: the nearest few become real lights after dark
  lampT -= dt;
  if (lampT <= 0) {
    lampT = 0.4;
    const near = lampHeads.map(v => [v, v.distanceToSquared(player.pos)]).sort((a, b) => a[1] - b[1]).slice(0, lampLights.length);
    lampLights.forEach((l, i) => { if (near[i]) l.position.copy(near[i][0]); });
  }
  for (const l of lampLights) l.intensity = nightness * 40;
  // fountain spray
  sprayT += dt;
  for (const f of fountainSpray) {
    const { pos, seedA, geo } = f;
    for (let i = 0; i < seedA.length; i++) { const t = (sprayT * 0.55 + seedA[i]) % 1, a = seedA[i] * 97.0; const r = 0.15 + t * 1.6; pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = 2.5 + t * 1.2 - t * t * 2.6; pos[i * 3 + 2] = Math.sin(a) * r; }

  else pr.hidden = true;

  if (waypoint) {
    const w = wpPos();
    beacon.position.set(w.x, 30, w.z); beacon.material.opacity = 0.14 + Math.sin(sprayT * 3) * 0.06;
    const d = Math.hypot(w.x - player.pos.x, w.z - player.pos.z);
    const bearing = Math.atan2(w.x - player.pos.x, w.z - player.pos.z) - (cam.yaw + Math.PI);

  if (!busy || fpsN % 6 === 0) renderer.render(scene, camera);
  fpsN++; fpsT += raw;
  if (fpsT >= 1) { if (world.fps) $('#fps').textContent = `${Math.round(fpsN / fpsT)} fps · ${renderer.info.render.calls} draws · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris · ${world.tier}`; window.__fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }

}

// =====================================================================
// Boot
// =====================================================================
const nextFrame = () => new Promise(r => setTimeout(r, 0));
async function boot() {
  const bar = $('#loadBar'), txt = $('#loadTxt'), step = (p, t) => { bar.style.width = p + '%'; txt.textContent = t; return nextFrame(); };
  await document.fonts?.ready?.catch?.(() => {});
  await step(15, 'Painting the streets…');
  buildTown();
  await step(55, 'Waking up the starlets…');
  buildNav();
  // the player
  const mySpec = Object.assign({}, me, { eyeColor: saved?.eyeColor, lips: saved?.makeup?.lips?.color, name: me.name });
  player.ch = makeCharacter(mySpec); scene.add(player.ch.group);
  const home = placeBy('home');
  if (world.x != null && Math.abs(world.x) < EDGE + 30) player.pos.set(world.x, 0, world.z);
  else player.pos.set(home.x + Math.sin(home.ry) * 1.5, 0, home.z + Math.cos(home.ry) * 1.5);
  collide(player.pos);
  player.ry = home.ry; cam.yaw = player.ry + Math.PI;
  // the other starlets, each starting at one of their favourite places
  for (const s of STARLETS) {
    if (s.id === me.id) continue;
    const spec = Object.assign({}, s, { outfit: s.look, colors: s.colors, eyeColor: '#3b2414' });
    const pp = spawnPerson(spec, { starlet: true, id: s.id });
    const at = placeBy(pick(HAUNTS[s.id])) || home;
    pp.pos.set(at.x + (rnd() - 0.5) * 6, 0, at.z + (rnd() - 0.5) * 3); pp.at = at; pp.timer = 2 + rnd() * 20;
  }
  await step(75, 'Filling the sidewalks…');
  for (let i = 0; i < T.crowd; i++) { const pp = spawnPerson(randomSpec(), { starlet: false }); const n = pick(nodes); pp.pos.set(n.x, 0, n.z); pp.timer = rnd() * 5; }
  // mannequins in the boutique window wear this week's looks
  for (const [x, z, ry, k, y = 0.5] of mannequinSpots) { const [outfit, colors] = MANNEQUIN_LOOKS[k]; const m = makeCharacter({ gender: 'f', skin: '#efe9e2', hair: 'buzz', hairColor: '#efe9e2', outfit, colors }); m.group.position.set(x, y, z); m.group.rotation.y = ry; animate(m, 0.016, 0); scene.add(m.group); }
  updateSky();
  await step(92, 'Turning on the lights…');
  renderer.compile(scene, camera);
  updateHud(true);
  $('#fps').hidden = !world.fps;
  await step(100, 'Welcome to Starlife Town');
  $('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 700);
  if (!saved) toast('Tip: pick your starlet in the suite first. Phone > Settings > Back to my suite.');
  else toast(`Welcome to town, ${me.name.split(' ')[0]}!`);
  canvas.focus();
  clock.getDelta(); tick();
}

boot().catch(err => { console.error(err); const e = $('#loadErr'); e.hidden = false; e.textContent = 'Starlife Town could not start: ' + (err && err.message || err) + '. It needs WebGL; try another browser.'; });
